<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="pink" data-paper="grid" data-doodle="off">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperNotes</title>
  <meta name="description" content="A notebook you can open in the browser. Markdown, images, video and PDFs on soft graph paper — study softly." />
  <meta name="color-scheme" content="light dark" />

  <!-- type: reading(Newsreader) · UI(Hanken Grotesk) · data(Spline Sans Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- markdown + syntax highlighting (globals: window.marked, window.hljs) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <link rel="stylesheet" href="PaperNotes/css/paper.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='84'>📓</text></svg>" />
</head>
<body>
  <noscript>
    <div style="padding:48px;text-align:center;font-family:sans-serif">
      PaperNotes needs JavaScript. The raw markdown lives in the person/module folders of this repo.
    </div>
  </noscript>

  <div class="app" id="app"><!-- rendered by PaperNotes/js/app.js --></div>

  <script type="module" src="PaperNotes/js/app.js"></script>
</body>
</html>
