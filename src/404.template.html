<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<script>
  // GitHub Pages serves this file for any path it cannot find under the
  // site, with the attempted path still in the address bar. The app routes
  // on the hash, so a path that was typed or pasted without the "#" ends up
  // here — this forwards it into the right route instead of dead-ending.
  //
  // BASE is injected at build time. When the build used relative asset URLs
  // (the default) it is null, and the site root is inferred: on github.io a
  // project site lives under /<repo>/, everything else at /.
  (function () {
    var BASE = __BASE__;
    var loc = window.location;

    var root = BASE;
    if (!root) {
      var segments = loc.pathname.split('/').filter(Boolean);
      var isProjectSite = /\.github\.io$/i.test(loc.hostname) && segments.length > 0;
      root = isProjectSite ? '/' + segments[0] + '/' : '/';
    }

    var attempted = loc.pathname;
    if (attempted.indexOf(root) === 0) attempted = attempted.slice(root.length);
    attempted = attempted.replace(/^\/+/, '');

    // Already at the root with nothing to forward: just load the app.
    var target = root + (attempted ? '#/' + attempted : '') + (loc.search || '');
    loc.replace(target);
  }());
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: hsl(40 24% 93%);
    color: hsl(36 14% 12%);
  }
  @media (prefers-color-scheme: dark) {
    body { background: hsl(36 10% 10%); color: hsl(40 14% 92%); }
  }
  main { max-width: 42ch; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 16px; opacity: 0.75; }
  a { color: hsl(88 30% 30%); }
  @media (prefers-color-scheme: dark) { a { color: hsl(84 32% 62%); } }
</style>
</head>
<body>
  <!-- Shown only if the redirect above did not run. -->
  <main>
    <h1>Not found</h1>
    <p>There is nothing at that address. The notes are routed on the fragment,
       so a link to a note looks like <code>#/folder/note.md</code>.</p>
    <p><a href="./">Go to the start</a></p>
  </main>
</body>
</html>
